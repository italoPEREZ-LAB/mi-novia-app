<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>¿Quieres ser mi novia?</title>

<link rel="stylesheet" href="style.css">

</head>

<script>

setInterval(()=>{

const heart =
document.createElement("div");

heart.innerHTML="❤️";

heart.style.position="absolute";

heart.style.left=
Math.random()*100+"vw";

heart.style.top="100vh";

heart.style.fontSize=
(Math.random()*30+20)+"px";

document.body.appendChild(heart);

let pos=100;

const anim=setInterval(()=>{

pos--;

heart.style.top=pos+"vh";

if(pos<0){

clearInterval(anim);

heart.remove();

}

},20);

},300);

</script>

<body>

    <audio id="musica" autoplay loop>
    <source src="audio/musica.mp3" type="audio/mpeg">
</audio>

<div class="hearts"></div>

<div class="container">

<h1>¿Quieres ser mi novia? ❤️</h1>

<img src="img/fondo.jpg" class="foto">

<div class="botones">

<button id="si">Sí ❤️</button>

<button id="no">No 😢</button>

</div>

</div>

<div id="final" class="oculto">

<h1>🎉 Gracias por aceptarme ❤️</h1>

<img src="img/pareja.jpg">

<p>
Ahora comienza nuestra historia juntos 💕
</p>

</div>

<script src="script.js"></script>

</body>

</html>
